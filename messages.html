<!DOCTYPE html>
<html lang="fr-CA" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PULSE CAD — Messagerie & Communications MDT</title>

  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="state.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
          colors: {
            royal: {
              950: '#0e1013',
              900: '#14171c',
              850: '#1a1d24',
              800: '#22262f',
              700: '#2d333f',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(130% 130% at 50% 0%, #2b303a 0%, #1b1e25 45%, #101216 100%);
      color: #f4f4f6;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3d4453; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #525b6e; }

    /* Outer Floating Dock */
    .dock-pill {
      background: rgba(18, 20, 24, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 26px;
      padding: 10px 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .dock-btn {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9499a5;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transform: scale(1.05);
    }
    .dock-btn.active {
      background: #ffffff;
      color: #111317;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* Main Window Chassis */
    .window-chassis {
      background: linear-gradient(170deg, rgba(28, 31, 38, 0.95) 0%, rgba(18, 20, 25, 0.97) 100%);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      height: calc(100vh - 2rem);
      margin: 1rem 1rem 1rem 0;
      position: relative;
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.015) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.3);
    }

    .chip-filter {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #9499a5;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip-filter:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .chip-filter.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="flex items-center p-3 select-none">

  <!-- LEFT FLOATING DOCK -->
  <aside class="w-16 flex flex-col items-center justify-between h-[calc(100vh-2rem)] py-2 z-40 flex-shrink-0">
    <div class="dock-pill">
      <a href="index.html" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-colors mb-1">
        <i data-lucide="sparkles" class="w-4 h-4 text-emerald-400"></i>
      </a>
      <a href="index.html" class="dock-btn" title="Tableau de bord"><i data-lucide="home" class="w-4 h-4"></i></a>
      <a href="dispatch.html" class="dock-btn" title="Prise d'Appel CAD [F2]"><i data-lucide="radio" class="w-4 h-4"></i></a>
      <a href="queue.html" class="dock-btn" title="File des missions [F3]"><i data-lucide="list-ordered" class="w-4 h-4"></i></a>
      <a href="map.html" class="dock-btn" title="Carte Flotte [F4]"><i data-lucide="globe" class="w-4 h-4"></i></a>
      <a href="messages.html" class="dock-btn active" title="Radio MDT Direct [F5]"><i data-lucide="message-square" class="w-4 h-4"></i></a>
      <a href="driver.html" class="dock-btn" title="Cockpit Chauffeur [F6]"><i data-lucide="smartphone" class="w-4 h-4"></i></a>
      <a href="receipt.html" class="dock-btn" title="Facturation"><i data-lucide="receipt" class="w-4 h-4"></i></a>
    </div>
    <div class="flex flex-col items-center gap-2">
      <button onclick="PulseState.resetDemoData(); renderAll();" class="w-11 h-11 bg-royal-900/90 hover:bg-royal-800 text-zinc-400 hover:text-white rounded-[16px] border border-white/10 flex items-center justify-center shadow-lg transition-transform hover:scale-105" title="Réinitialiser données démo">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <!-- MAIN WINDOW CHASSIS -->
  <div class="window-chassis">
    
    <!-- TOP WINDOW HEADER -->
    <header class="h-16 px-6 border-b border-white/5 flex items-center justify-between flex-shrink-0 select-none bg-royal-950/60 backdrop-blur-md z-30">
      <div class="flex items-center gap-4">
        <!-- macOS dots -->
        <div class="flex items-center gap-2 mr-2">
          <span class="w-3 h-3 rounded-full bg-[#ff5f57] border border-[#e0443e]"></span>
          <span class="w-3 h-3 rounded-full bg-[#febc2e] border border-[#d89e24]"></span>
          <span class="w-3 h-3 rounded-full bg-[#28c840] border border-[#1aab29]"></span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">Messagerie MDT & Canal Radio</h1>
          <p class="text-xs text-zinc-400">Diffusion centrale de voirie et communications privées terminaux</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-royal-950 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-sm transition-colors">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span>Diffuser Consigne [MDT]</span>
        </button>

        <div class="hidden sm:flex items-center gap-2 bg-white/[0.04] border border-white/10 px-3 py-1.5 rounded-xl">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="live-clock" class="font-mono text-xs font-semibold text-zinc-200">--:--:--</span>
        </div>
      </div>
    </header>

    <!-- CONTENT BODY -->
    <main class="flex-1 flex flex-col p-6 overflow-hidden">
      
      <!-- SUB-BAR FILTERS -->
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-white/5 flex-shrink-0">
        <div class="flex items-center gap-2">
          <button class="chip-filter active" onclick="filterCategory('all', this)">Toutes (<span id="count-all">0</span>)</button>
          <button class="chip-filter" onclick="filterCategory('unread', this)">Non lus (<span id="count-unread">0</span>)</button>
          <button class="chip-filter" onclick="filterCategory('urgent', this)">Alertes Urgentes</button>
        </div>

        <div class="text-xs text-zinc-400 font-mono">
          Canal Radio Chiffré AES-256
        </div>
      </div>

      <!-- TWO-PANEL SPLIT VIEW -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 overflow-hidden">
        
        <!-- LEFT: MESSAGES LIST (5 COLS) -->
        <div class="lg:col-span-5 flex flex-col glass-card overflow-hidden">
          <div class="p-3.5 bg-royal-950/80 border-b border-white/5 flex items-center justify-between flex-shrink-0">
            <span class="text-xs font-bold uppercase tracking-wider text-white">Boîte de Réception MDT</span>
            <span class="text-[10px] font-mono text-zinc-400">FLUX LIVE</span>
          </div>

          <div class="flex-1 overflow-y-auto divide-y divide-white/5" id="msg-list-container">
            <!-- Injected via JavaScript -->
          </div>
        </div>

        <!-- RIGHT: DETAIL (7 COLS) -->
        <div class="lg:col-span-7 flex flex-col glass-card overflow-hidden">
          <div id="preview-panel" class="flex-1 flex flex-col overflow-hidden p-6 text-zinc-300">
            <!-- Injected by JavaScript -->
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- MODAL: NOUVEAU MESSAGE MDT -->
  <div id="msg-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 items-center justify-center hidden p-4" onclick="closeModalOnBg(event)">
    <div class="bg-royal-900 border border-white/10 rounded-2xl max-w-lg w-full p-6 shadow-2xl text-white">
      <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
        <span class="text-sm font-bold uppercase tracking-wider text-white">Émission MDT // Dispatch Central</span>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-zinc-300 flex items-center justify-center font-bold text-sm transition-colors">✕</button>
      </div>

      <div class="flex flex-col gap-3 text-xs">
        <div>
          <label class="block font-semibold text-zinc-300 mb-1">Cible de Diffusion</label>
          <select id="modal-to" class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 font-bold outline-none text-white">
            <option value="TOUTE LA FLOTTE MÉTROPOLITAINE">DIFFUSION GÉNÉRALE — TOUTE LA FLOTTE</option>
            <option value="ZONE-01 (CENTRE-VILLE)">ZONE-01 (CENTRE-VILLE)</option>
            <option value="ZONE-02 (AÉROPORT-YUL)">ZONE-02 (AÉROPORT TRUDEAU YUL)</option>
            <option value="UNIT-232 // TERMINAL EMBARQUÉ">UNIT-232 (TERMINAL EMBARQUÉ)</option>
          </select>
        </div>

        <div>
          <label class="block font-semibold text-zinc-300 mb-1">Priorité</label>
          <div class="grid grid-cols-3 gap-2" id="modal-prio-group">
            <button type="button" onclick="setModalPrio('NORMALE', this)" class="modal-prio-btn rounded-xl border border-white/10 p-2 font-bold uppercase bg-white/5 hover:bg-white/10 text-zinc-300">NORMALE</button>
            <button type="button" onclick="setModalPrio('URGENTE', this)" class="modal-prio-btn rounded-xl border border-emerald-500/30 p-2 font-bold uppercase bg-emerald-500 text-royal-950">URGENTE</button>
            <button type="button" onclick="setModalPrio('VIP', this)" class="modal-prio-btn rounded-xl border border-white/10 p-2 font-bold uppercase bg-white/5 hover:bg-white/10 text-zinc-300">VIP</button>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-zinc-300 mb-1">Objet</label>
          <input id="modal-subject" class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 font-bold outline-none text-white" type="text" placeholder="Ex: Ralentissement A-15 / Déviation voirie" />
        </div>

        <div>
          <label class="block font-semibold text-zinc-300 mb-1">Corps de Transmission</label>
          <textarea id="modal-body" class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 outline-none text-white" rows="3" placeholder="Saisir la consigne..."></textarea>
        </div>

        <div class="flex justify-end gap-2 mt-2">
          <button onclick="sendNewMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-royal-950 px-5 py-2.5 rounded-xl font-bold uppercase text-xs transition-colors">
            Diffuser Message
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let currentSelectedId = null;
    let currentFilter = 'all';
    let modalPriority = 'URGENTE';

    function initClock() {
      const update = () => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('fr-CA', { hour12: false });
        const el = document.getElementById('live-clock');
        if (el) el.textContent = timeStr;
      };
      update();
      setInterval(update, 1000);
    }
    initClock();

    function renderAll() {
      const msgs = PulseState.getMessages();
      const countAll = document.getElementById('count-all');
      const countUnread = document.getElementById('count-unread');
      
      const unread = msgs.filter(m => m.unread).length;
      if (countAll) countAll.textContent = msgs.length;
      if (countUnread) countUnread.textContent = unread;

      renderMessageList();
      if (!currentSelectedId && msgs.length > 0) {
        selectMessage(msgs[0].id);
      } else if (currentSelectedId) {
        renderPreview();
      }
    }

    function renderMessageList() {
      const container = document.getElementById('msg-list-container');
      const msgs = PulseState.getMessages();
      container.innerHTML = '';

      let filtered = msgs;
      if (currentFilter === 'unread') filtered = msgs.filter(m => m.unread);
      else if (currentFilter === 'urgent') filtered = msgs.filter(m => m.priority === 'URGENTE' || m.subject.toLowerCase().includes('urgent') || m.subject.toLowerCase().includes('alerte'));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-zinc-500 text-xs">Aucune transmission dans ce filtre.</div>`;
        return;
      }

      filtered.forEach(msg => {
        const isSelected = msg.id === currentSelectedId;
        const div = document.createElement('div');
        div.className = `p-3.5 cursor-pointer transition-colors ${isSelected ? 'bg-white/10 border-l-2 border-emerald-400' : 'hover:bg-white/[0.03]'}`;
        div.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-xs ${msg.unread ? 'text-white' : 'text-zinc-400'}">${msg.from}</span>
            <span class="text-[10px] text-zinc-500 font-mono">${msg.time}</span>
          </div>
          <div class="text-xs font-semibold ${msg.unread ? 'text-emerald-400' : 'text-zinc-300'} truncate">${msg.subject}</div>
          <div class="text-[11px] text-zinc-500 truncate mt-0.5">${msg.body}</div>
        `;
        div.onclick = () => selectMessage(msg.id);
        container.appendChild(div);
      });
    }

    function selectMessage(id) {
      currentSelectedId = id;
      PulseState.markMessageRead(id);
      renderAll();
    }

    function renderPreview() {
      const panel = document.getElementById('preview-panel');
      const msg = PulseState.getMessages().find(m => m.id === currentSelectedId);
      if (!msg) {
        panel.innerHTML = `<div class="m-auto text-zinc-500 text-xs">Sélectionnez une transmission pour afficher le détail.</div>`;
        return;
      }

      panel.innerHTML = `
        <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-4">
          <div>
            <span class="text-[10px] font-mono font-bold bg-white/10 text-emerald-400 px-2 py-0.5 rounded border border-white/10 uppercase">
              ${msg.category || 'TRANSMISSION MDT'}
            </span>
            <h2 class="text-lg font-bold text-white mt-2">${msg.subject}</h2>
          </div>
          <span class="font-mono text-xs text-zinc-400">${msg.time}</span>
        </div>

        <div class="bg-black/30 p-3 rounded-xl border border-white/5 text-xs space-y-1 mb-4">
          <div>ÉMETTEUR : <strong class="text-white">${msg.from}</strong></div>
          <div>CIBLE : <strong class="text-zinc-300">${msg.to || 'DISPATCH CENTRAL'}</strong></div>
          <div>CANAL : <span class="text-emerald-400 font-mono">ENCRYPTED-4G // RSSI OPTIMAL</span></div>
        </div>

        <div class="flex-1 bg-black/20 p-4 rounded-xl border border-white/5 text-sm leading-relaxed text-zinc-200 overflow-y-auto mb-4 font-mono">
          ${msg.body}
        </div>

        <div class="flex gap-2">
          <button onclick="reply104()" class="bg-emerald-500 hover:bg-emerald-600 text-royal-950 px-4 py-2 rounded-xl text-xs font-bold uppercase transition-colors">
            10-4 Accusé Réception
          </button>
        </div>
      `;
    }

    function reply104() {
      const msg = PulseState.getMessages().find(m => m.id === currentSelectedId);
      if (msg) {
        PulseState.addMessage(
          'DISPATCH CENTRAL',
          `10-4 ACK SUR: ${msg.subject}`,
          `Transmission bien acquittée et archivée par la console centrale.`,
          'DISP'
        );
        alert("10-4 REÇU ET ACQUITTÉ !");
      }
    }

    function filterCategory(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMessageList();
    }

    function openModal() {
      document.getElementById('msg-modal').classList.remove('hidden');
      document.getElementById('msg-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('msg-modal').classList.add('hidden');
      document.getElementById('msg-modal').style.display = 'none';
    }
    function closeModalOnBg(e) {
      if (e.target === document.getElementById('msg-modal')) closeModal();
    }

    function setModalPrio(prio, btn) {
      modalPriority = prio;
      document.querySelectorAll('.modal-prio-btn').forEach(b => {
        b.className = 'modal-prio-btn rounded-xl border border-white/10 p-2 font-bold uppercase bg-white/5 hover:bg-white/10 text-zinc-300';
      });
      btn.className = 'modal-prio-btn rounded-xl border border-emerald-500/30 p-2 font-bold uppercase bg-emerald-500 text-royal-950';
    }

    function sendNewMessage() {
      const to = document.getElementById('modal-to').value;
      const subj = document.getElementById('modal-subject').value.trim();
      const body = document.getElementById('modal-body').value.trim();
      if (!subj || !body) {
        alert("Veuillez remplir l'objet et le corps de la transmission.");
        return;
      }

      PulseState.addMessage('DISPATCH CENTRAL', subj, body, 'DISP', modalPriority, to);
      closeModal();
      renderAll();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAll();
      PULSE_CHANNEL.onmessage = () => renderAll();
    });
  </script>
</body>
</html>
